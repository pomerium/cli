name: Release
permissions:
  contents: read
defaults:
  run:
    shell: bash
on:
  release:
    types:
      - published

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      versionFlags: ${{ steps.flags.outputs.versionFlags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set build version metadata flags
        id: flags
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          ldflags=(
            "-X github.com/pomerium/cli/version.Version=$VERSION"
            "-X github.com/pomerium/cli/version.GitCommit=$(git rev-parse --short HEAD)"
            "-X github.com/pomerium/cli/version.BuildMeta=$(date +%s)"
            "-X github.com/pomerium/cli/version.ProjectName=pomerium-cli"
            "-X github.com/pomerium/cli/version.ProjectURL=https://www.pomerium.com"
          )
          echo "versionFlags=${ldflags[*]}" >> "$GITHUB_OUTPUT"

  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    needs: metadata
    outputs:
      checksums: ${{ steps.build.outputs.checksums }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Build and archive
        id: build
        shell: bash
        env:
          VERSION_FLAGS: ${{ needs.metadata.outputs.versionFlags }}
        run: |
          echo 'checksums<<EOF' >> "$GITHUB_OUTPUT"
          for arch in amd64 arm64; do
            mkdir -p "bin/$arch"
            GOARCH=$arch CGO_ENABLED=1 go build -o "bin/$arch" \
              -ldflags="-s -w $VERSION_FLAGS" \
              ./cmd/pomerium-cli
            zipfile="pomerium-cli-windows-$arch.zip"
            powershell "Compress-Archive -Path bin\\$arch\\\* -DestinationPath $zipfile"
            hash=$(powershell "(Get-FileHash $zipfile -Algorithm SHA256).Hash.ToLower()")
            echo "$hash  $zipfile" >> "$GITHUB_OUTPUT"
          done
          echo EOF >> "$GITHUB_OUTPUT"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload --clobber "$VERSION" pomerium-cli-windows-*.zip

  build-darwin:
    permissions:
      contents: write
    runs-on: macos-15
    needs: metadata
    environment: apple-signing
    timeout-minutes: 90
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    steps:
      - name: Check signing secrets
        env:
          SECRETS_SET: ${{ secrets.MACOS_SIGN_P12 && secrets.MACOS_SIGN_PASSWORD && secrets.MACOS_INSTALLER_P12 && secrets.MACOS_INSTALLER_PASSWORD && secrets.APPLE_ID_KEY && secrets.APPLE_ID && secrets.APPLE_ID_KEY_ISSUER && 'true' }}
        run: test "$SECRETS_SET" = true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Build macOS binaries
        env:
          VERSION_FLAGS: ${{ needs.metadata.outputs.versionFlags }}
        run: |
          for arch in amd64 arm64; do
            mkdir -p "bin/$arch"
            GOARCH=$arch CGO_ENABLED=1 go build -o "bin/$arch" \
              -ldflags="-s -w $VERSION_FLAGS" \
              ./cmd/pomerium-cli
          done
          mkdir -p bin/universal
          lipo -create -output bin/universal/pomerium-cli bin/amd64/pomerium-cli bin/arm64/pomerium-cli

      - name: Import signing certificates
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/apple-signing"
          keychain="$RUNNER_TEMP/apple-signing/signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/apple-signing/sign.p12"
          printf '%s' "$MACOS_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/apple-signing/installer.p12"
          security import "$RUNNER_TEMP/apple-signing/sign.p12" -k "$keychain" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/apple-signing/installer.p12" -k "$keychain" -P "$MACOS_INSTALLER_PASSWORD" -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # codesign uses the search list to build the certificate chain.
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/apple-signing/sign.p12" "$RUNNER_TEMP/apple-signing/installer.p12"

      - name: Sign and package
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          keychain="$RUNNER_TEMP/apple-signing/signing.keychain-db"
          for arch in amd64 arm64 universal; do
            codesign --force --timestamp --options runtime --keychain "$keychain" \
              --sign "Developer ID Application" "bin/$arch/pomerium-cli"
            codesign --verify --strict --verbose=2 "bin/$arch/pomerium-cli"
            codesign -dv "bin/$arch/pomerium-cli" 2>&1 | grep -Fx 'TeamIdentifier=4RYVW695ZQ'
            zip -qj "pomerium-cli-darwin-$arch.zip" "bin/$arch/pomerium-cli"
          done
          pkgbuild --root bin/universal --identifier com.pomerium.pomerium-cli --version "${VERSION#v}" \
            --install-location /usr/local/bin/ --keychain "$keychain" \
            --sign "Developer ID Installer" --timestamp pomerium-cli.pkg
          pkgutil --check-signature pomerium-cli.pkg

      - name: Notarize and staple
        env:
          MACOS_NOTARY_KEY: ${{ secrets.APPLE_ID_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.APPLE_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.APPLE_ID_KEY_ISSUER }}
        run: |
          umask 077
          printf '%s' "$MACOS_NOTARY_KEY" > "$RUNNER_TEMP/apple-signing/notary.p8"
          for file in pomerium-cli-darwin-*.zip pomerium-cli.pkg; do
            xcrun notarytool submit "$file" --key "$RUNNER_TEMP/apple-signing/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" \
              --issuer "$MACOS_NOTARY_ISSUER_ID" --wait --timeout 15m --output-format json > "$RUNNER_TEMP/apple-signing/notary.json"
            cat "$RUNNER_TEMP/apple-signing/notary.json"
            jq -e '.status == "Accepted"' "$RUNNER_TEMP/apple-signing/notary.json"
          done
          xcrun stapler staple pomerium-cli.pkg
          xcrun stapler validate pomerium-cli.pkg
          spctl --assess --type install --verbose=2 pomerium-cli.pkg

      - name: Remove signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/apple-signing/signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/apple-signing/sign.p12" "$RUNNER_TEMP/apple-signing/installer.p12" \
            "$RUNNER_TEMP/apple-signing/notary.p8" "$RUNNER_TEMP/apple-signing/notary.json"
          if [[ -d "$RUNNER_TEMP/apple-signing" ]]; then
            rmdir "$RUNNER_TEMP/apple-signing"
          fi

      - name: Compute checksums
        id: checksums
        run: |
          {
            echo 'checksums<<EOF'
            shasum -a 256 pomerium-cli-darwin-*.zip pomerium-cli.pkg
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload --clobber "$VERSION" pomerium-cli-darwin-*.zip pomerium-cli.pkg

  goreleaser:
    permissions:
      contents: write
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    needs: metadata
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    outputs:
      tag: ${{ steps.tagName.outputs.tag }}
      checksums: ${{ steps.checksums.outputs.checksums }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs commit history for changelog
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c # v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.8.2
          args: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_FLAGS: ${{ needs.metadata.outputs.versionFlags }}

      - name: Compute checksums
        id: checksums
        working-directory: ./dist
        run: |
          {
            echo 'checksums<<EOF'
            shasum -a 256 ./*.{tar.gz,deb,rpm}
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Get tag name
        id: tagName
        run: |
          TAG=$(git describe --tags --exact-match)
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "pkgversion=$(tr '-' '~' <<<"${TAG#v}")"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cloudsmith CLI
        if: "!github.event.release.prerelease"
        run: |
          pip3 install cloudsmith-cli

      - name: Publish to Cloudsmith
        if: "!github.event.release.prerelease"
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          VERSION: ${{ steps.tagName.outputs.pkgversion }}
        working-directory: dist/
        run: |
          rpms=("pomerium-cli-${VERSION}-1.aarch64.rpm" "pomerium-cli-${VERSION}-1.x86_64.rpm" "pomerium-cli-${VERSION}-1.armv6hl.rpm" "pomerium-cli-${VERSION}-1.armv7hl.rpm")
          for pkg in "${rpms[@]}"; do
            cloudsmith push rpm pomerium/pomerium/el/any-version "$pkg"
          done

          debs=("pomerium-cli_${VERSION}-1_amd64.deb" "pomerium-cli_${VERSION}-1_arm64.deb" "pomerium-cli_${VERSION}-1_armhf.deb")
          for pkg in "${debs[@]}"; do
            cloudsmith push deb pomerium/pomerium/debian/any-version "$pkg"
          done

      - name: Find latest tag
        id: latestTag
        run: |
          LATEST_TAG=$(git tag | grep -vi 'rc' | sort --version-sort | tail -1)
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish latest tag
        if: "steps.latestTag.outputs.tag == steps.tagName.outputs.tag"
        env:
          TAG: ${{ steps.tagName.outputs.tag }}
        run: |
          docker manifest create -a pomerium/cli:latest "pomerium/cli:amd64-$TAG" "pomerium/cli:arm64v8-$TAG"
          docker manifest push pomerium/cli:latest

  finish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-darwin, build-windows, goreleaser]
    steps:
      - name: Upload checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.release.tag_name }}
          WINDOWS_CHECKSUMS: ${{ needs.build-windows.outputs.checksums }}
          GORELEASER_CHECKSUMS: ${{ needs.goreleaser.outputs.checksums }}
          DARWIN_CHECKSUMS: ${{ needs.build-darwin.outputs.checksums }}
        run: |
          {
            echo "$WINDOWS_CHECKSUMS"
            echo "$GORELEASER_CHECKSUMS"
            echo "$DARWIN_CHECKSUMS"
          } >> pomerium-cli_checksums.txt
          gh release upload --clobber "$VERSION" pomerium-cli_checksums.txt

      - id: clean_version
        run: |
          echo "release=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: "${{ github.event.release.tag_name }}"

      - name: Find highest vX.Y.Z tag
        id: highestTag
        run: |
          tags=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY")
          echo "tag=$(grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | cut -d/ -f3 | sort --version-sort | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Create CI token
        id: ci-token
        if: ${{ !github.event.release.prerelease && steps.highestTag.outputs.tag == github.event.release.tag_name }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          owner: pomerium
          repositories: homebrew-tap
          permission-contents: write

      - name: Update homebrew tap
        if: ${{ !github.event.release.prerelease && steps.highestTag.outputs.tag == github.event.release.tag_name }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          repository: pomerium/homebrew-tap
          token: ${{ steps.ci-token.outputs.token }}
          event-type: pomerium-cli-release
          client-payload: '{ "version": "${{ steps.clean_version.outputs.release }}" }'
